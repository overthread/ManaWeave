# Render Blueprint — ManaWeave (single web service: HTTP + WebSocket + static client)
# Docs: https://render.com/docs/blueprint-spec
#
# Free plan: no persistent disk. The container filesystem is ephemeral, so
# accounts, saved decks (server/data/accounts.json + decks.json) and the auth
# token secret all last only while the instance is up — they're wiped on
# redeploy and on spin-down (free services sleep after 15 min of inactivity;
# first request after that takes ~30-60s to cold-start).
#
# To keep them across restarts, set DATABASE_URL (env var below) to a managed
# Postgres connection string — a free Neon database works (https://neon.tech):
# create a project, copy the connection string (postgresql://user:pass@host/
# dbname?sslmode=require) into the Render dashboard. Tables are created
# automatically on first boot. Alternatively, upgrade to a paid plan and
# re-add the disk block + DATA_DIR=/var/data.

services:
  - type: web
    name: manaweave
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/infrastructure/http/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # Postgres connection string (e.g. free Neon database) — persists
      # accounts, decks and login sessions across restarts. Leave blank to
      # use the ephemeral server/data JSON files.
      - key: DATABASE_URL
        sync: false
      # Optional: publish Google Sheets as CSV to override the built-in catalog.
      # Leave blank in the dashboard to use the 14 built-in cards.
      - key: CARD_CSV_UNITS_URL
        sync: false
      - key: CARD_CSV_SPELLS_URL
        sync: false
