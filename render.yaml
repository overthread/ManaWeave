# Render Blueprint — ManaWeave (single web service: HTTP + WebSocket + static client)
# Docs: https://render.com/docs/blueprint-spec
#
# Free plan: no persistent disk. The container filesystem is ephemeral, so
# saved decks (server/data/decks.json) and in-progress games last only while
# the instance is up — they're wiped on redeploy and on spin-down (free
# services sleep after 15 min of inactivity; first request after that takes
# ~30-60s to cold-start). To persist decks later, upgrade to a paid plan and
# re-add the disk block + DATA_DIR=/var/data.

services:
  - type: web
    name: manaweave
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/infrastructure/http/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # Optional: publish Google Sheets as CSV to override the built-in catalog.
      # Leave blank in the dashboard to use the 37 built-in cards.
      - key: CARD_CSV_UNITS_URL
        sync: false
      - key: CARD_CSV_SPELLS_URL
        sync: false
