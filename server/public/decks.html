<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ManaWeave — Deck Builder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8dcc2'/%3E%3Cpath d='M32 7l5.5 19.5L57 32l-19.5 5.5L32 57l-5.5-19.5L7 32l19.5-5.5z' fill='%23714a2b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1><span class="sigil" aria-hidden="true">✦</span>Mana<span>Weave</span></h1>
    <span class="tag">pattern workshop</span>
    <span class="spacer"></span>
    <a href="/lobby.html">Back to Lobby</a>
    <span id="auth-area"></span>
  </header>

  <main class="page">
    <div class="error-banner" id="error-banner"></div>
    <div class="builder-grid">
      <section class="panel">
        <h2 style="margin-top:0">Card catalog</h2>
        <div class="filter-row" id="colour-filters"></div>
        <div class="filter-row" id="type-filters"></div>
        <div class="catalog-grid" id="catalog-grid"></div>
      </section>

      <section>
        <div class="panel" style="margin-bottom:14px">
          <h2 style="margin-top:0">Your loom</h2>
          <p class="muted" style="font-size:12px; margin:4px 0 10px">Click a thread to cycle its colour. Every coloured card in your deck needs a matching thread.</p>
          <div class="loom-picker" id="loom-picker"></div>
          <div class="validation-note" id="loom-note"></div>
        </div>

        <div class="panel" style="margin-bottom:14px">
          <h2 style="margin-top:0">Pattern (deck)</h2>
          <div style="display:flex; gap:8px; margin-bottom:8px">
            <input id="deck-name" placeholder="Deck name" style="flex:1" />
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px">
            <button id="save-deck" class="primary">Save Deck</button>
            <button id="new-deck">New</button>
            <button id="sample-riot">Sample: Riff Riot</button>
            <button id="sample-swarm">Sample: Sporic Swarm</button>
            <button id="sample-astral">Sample: Astral Alignment</button>
          </div>
          <div id="deck-entries"></div>
          <div class="validation-note" id="deck-note"></div>
        </div>

        <div class="panel">
          <h2 style="margin-top:0">Saved patterns</h2>
          <div id="saved-decks" class="muted">Loading…</div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/deck-builder.js"></script>
</body>
</html>
